[workspace]
members = [
    "crates/svsim",
    "crates/svsim-cli",
    "crates/svsim-render",
]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT OR Apache-2.0"
authors = ["Codex"]

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sv-parser = "0.13"
thiserror = "2"

# The test suite simulates whole corpus programs; unoptimized svsim is ~9x
# slower, which makes `cargo test` unusable as the green-corpus gate.
[profile.dev.package.svsim]
opt-level = 2

[profile.test.package.svsim]
opt-level = 2
